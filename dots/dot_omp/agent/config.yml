symbolPreset: nerd
setupVersion: 1
modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  smol: openai-codex/gpt-5.6-terra:medium
  slow: openai-codex/gpt-5.6-sol:xhigh
  plan: openai-codex/gpt-5.6-sol:high
  advisor: openai-codex/gpt-5.6-sol:high
  task: openai-codex/gpt-5.6-terra:medium
  designer: openai-codex/gpt-5.6-sol:high
  vision: openai-codex/gpt-5.6-terra:medium
  commit: openai-codex/gpt-5.6-luna:low
  tiny: openai-codex/gpt-5.6-luna:low
statusLine:
  preset: custom
  separator: slash
  leftSegments:
    - path
    - git
    - mode
  rightSegments:
    - model
    - context_pct
  segmentOptions: null
  model:
    showThinkingLevel: true
  path:
    abbreviate: true
    maxLength: 40
  git:
    showBranch: true
  transparent: true
  compactThinkingLevel: true
textVerbosity: low
display:
  cacheMissMarker: true
compaction:
  strategy: context-full
