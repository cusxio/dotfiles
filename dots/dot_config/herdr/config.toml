# herdr configuration
# Docs: https://herdr.dev/docs/configuration/
onboarding = false

[theme]
name = "kanagawa"

[theme.custom]
panel_bg = "reset"

[terminal]
default_shell = "fish"

# New panes/tabs/workspaces inherit the source pane/workspace cwd.
new_cwd = "follow"

[keys]
prefix = "ctrl+semicolon"

[ui]
sidebar_collapsed_mode = "hidden"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-right"
