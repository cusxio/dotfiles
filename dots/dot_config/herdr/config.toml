# Herdr configuration
# Reference: https://herdr.dev/docs/config-reference/
onboarding             = false

[theme]
name                   = "kanagawa"

[theme.custom]
panel_bg               = "reset"

[terminal]
default_shell          = "fish"

# New panes/tabs/workspaces inherit the source pane/workspace cwd.
new_cwd                = "follow"

[keys]
prefix                 = "ctrl+a"

# Tabs
new_tab                = "prefix+n"
previous_tab           = "prefix+["
next_tab               = "prefix+]"
switch_tab             = "prefix+1..9"

# Panes
copy_mode              = "prefix+shift+v"

focus_pane_left        = "ctrl+h"
focus_pane_down        = "ctrl+j"
focus_pane_up          = "ctrl+k"
focus_pane_right       = "ctrl+l"
cycle_pane_next        = "prefix+tab"
cycle_pane_previous    = "prefix+shift+tab"

split_vertical         = "prefix+v"
split_horizontal       = "prefix+s"

[ui]
sidebar_collapsed_mode = "hidden"

[ui.toast]
delivery               = "herdr"
delay_seconds          = 1

[ui.toast.herdr]
position               = "top-right"

[ui.toast.clipboard]
enabled                = true
position               = "bottom-right"
