[tools]
# Languages and runtimes
bun = "latest"
# go = "latest"
java = "zulu-17"
node = "latest"
python = "latest"
ruby = "latest"

# CLI tools
amp = "latest"
aube = "latest"
# "github:aubepkg/aube" = "latest"
bat = "latest"
chezmoi = "latest"
cloudflared = "latest"
delta = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
herdr = "latest"
hunk = "latest"
hyperfine = "latest"
lazygit = "latest"
lsd = "latest"
neovim = "latest"
nub = "latest"
pi = "latest"
ripgrep = "latest"
tree-sitter = "latest"
xh = "latest"
yt-dlp = "latest"
zoxide = "latest"

# Aqua tools
"aqua:planetscale/cli" = "latest"

# GitHub tools
"github:1broseidon/ketch" = "latest"
"github:backnotprop/plannotator" = "latest"
"github:can1357/oh-my-pi" = "latest"
"github:Dicklesworthstone/destructive_command_guard" = "latest"
"github:vercel-labs/fx" = "latest"

# npm tools
# "npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@opencode-ai/cli" = { version = "beta", allow_builds = ["@opencode-ai/cli"] }

[bootstrap.packages]
"brew:btop" = "latest"
"brew:exiftool" = "latest"
"brew:fish" = "latest"
"brew:git" = "latest"
"brew:libyaml" = "latest"
"brew:trash" = "latest"

[settings]
minimum_release_age = "0s"

[settings.npm]
package_manager = "aube"

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[settings.ruby]
compile = false
