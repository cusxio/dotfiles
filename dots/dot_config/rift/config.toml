[settings]
default_disable = false
focus_follows_mouse = false
mouse_follows_focus = false
mouse_hides_on_focus = false

[settings.layout]
# mode = "bsp"
mode = "traditional"

[settings.layout.master_stack]
master_ratio = 0.5
new_window_placement = "focused"

[settings.ui.menu_bar]
enabled = true
mode = "active"
display_style = "label"

# JankyBorders strokes are centered on window edges. For a 6-point border,
# 3-point outer gaps and 6-point inner gaps let the borders meet evenly.
[settings.layout.gaps.outer]
top = 3
left = 3
bottom = 3
right = 3

[settings.layout.gaps.inner]
horizontal = 6
vertical = 6

[virtual_workspaces]
default_workspace_count = 7
auto_assign_windows = true
app_rules = [
  # Floating apps shared with AeroSpace and OmniWM.
  { app_id = "com.microsoft.Outlook", floating = true },
  { app_id = "com.apple.TextEdit", floating = true },
  { app_id = "com.apple.finder", floating = true },
  { app_id = "com.apple.iphonesimulator", floating = true },
  { app_id = "com.1password.1password", floating = true },
  { app_id = "dev.kdrag0n.MacVirt", floating = true },
  { app_id = "com.eltima.elmedia6.mas", floating = true },
  { app_id = "org.qbittorrent.qBittorrent", floating = true },
  { app_id = "com.apple.systempreferences", floating = true },
  { app_id = "com.apple.ActivityMonitor", floating = true },
  { app_id = "io.canarymail.mac", floating = true },
  { app_id = "com.electron.ollama", floating = true },
  { app_id = "com.tinyapp.TablePlus", floating = true },
  { app_id = "app.yaak.desktop", floating = true },
  { app_id = "com.luckymarmot.Paw", floating = true },
  { app_id = "ai.elementlabs.lmstudio", floating = true },
  { app_id = "com.readdle.PDFExpert-Mac", floating = true },
  { app_id = "com.pdfeditor.pdfeditormac", floating = true },
  { app_id = "org.mozilla.thunderbird", floating = true },
  { app_id = "com.fournova.Tower3", floating = true },
  { app_id = "app.kaleidoscope.v4", floating = true },

  # OmniWM workspace numbers are 1-based; Rift's are 0-based.
  { app_id = "com.spotify.client", workspace = 6 },
  { app_id = "net.whatsapp.WhatsApp", workspace = 4 },
  { app_id = "com.hnc.Discord", workspace = 5 },
  { app_id = "ru.keepcoder.Telegram", workspace = 5 },
]

[modifier_combinations]
hyper = "Ctrl + Alt + Meta"

[keys]
"hyper + Q" = "close_window"
"hyper + F" = "toggle_fullscreen"

"hyper + H" = { move_focus = "left" }
"hyper + J" = { move_focus = "down" }
"hyper + K" = { move_focus = "up" }
"hyper + L" = { move_focus = "right" }

"hyper + Shift + H" = { move_node = "left" }
"hyper + Shift + J" = { move_node = "down" }
"hyper + Shift + K" = { move_node = "up" }
"hyper + Shift + L" = { move_node = "right" }

"hyper + Minus" = { resize_window_shrink = "smart" }
"hyper + Equal" = { resize_window_grow = "smart" }

"hyper + 1" = { switch_to_workspace = 0 }
"hyper + 2" = { switch_to_workspace = 1 }
"hyper + 3" = { switch_to_workspace = 2 }
"hyper + 4" = { switch_to_workspace = 3 }
"hyper + 5" = { switch_to_workspace = 4 }
"hyper + 6" = { switch_to_workspace = 5 }
"hyper + 7" = { switch_to_workspace = 6 }

"hyper + Shift + 1" = { move_window_to_workspace = 0 }
"hyper + Shift + 2" = { move_window_to_workspace = 1 }
"hyper + Shift + 3" = { move_window_to_workspace = 2 }
"hyper + Shift + 4" = { move_window_to_workspace = 3 }
"hyper + Shift + 5" = { move_window_to_workspace = 4 }
"hyper + Shift + 6" = { move_window_to_workspace = 5 }
"hyper + Shift + 7" = { move_window_to_workspace = 6 }

"hyper + Tab" = "switch_to_last_workspace"
"hyper + LeftSquareBracket" = "prev_workspace"
"hyper + RightSquareBracket" = "next_workspace"
